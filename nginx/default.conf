# Reverse proxy configuration for multi-service application

# Frontend (React) - served on port 80
upstream frontend {
  server frontend:80;
}

# API service - proxied on port 5000
upstream api {
  server api:5000;
}

# MongoDB exporter metrics on port 9216
upstream mongo_exporter {
  server mongo:9216;
}

# Redis exporter metrics on port 9121
upstream redis_exporter {
  server redis:9121;
}

# Serve React frontend on root
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Serve static files from React app
    location / {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data:'unsafe-inline'" always;
}